
<div class="create-ticket-page">

  <!-- Header -->

  <header class="page-header">

    <div
      class="brand"
      (click)="goBack()">

      <h1>FixMyCampus</h1>

      <p>
        Campus Issue Reporting & Maintenance Tracker
      </p>

    </div>

    <button
      type="button"
      (click)="goBack()">

      Back to Dashboard

    </button>

  </header>


  <!-- Form -->

  <main class="form-container">

    <section class="form-card">

      <h2>Report a Campus Issue</h2>

      <p class="form-description">
        Please provide information about the issue you
        want to report.
      </p>


      <form
        (ngSubmit)="createTicket()">


        <!-- Title -->

        <div class="form-group">

          <label for="title">
            Issue Title
          </label>

          <input
            id="title"
            type="text"
            name="title"
            [(ngModel)]="ticket.title"
            placeholder="Example: Computer is not working"
            required
          />

        </div>


        <!-- Description -->

        <div class="form-group">

          <label for="description">
            Description
          </label>

          <textarea
            id="description"
            name="description"
            [(ngModel)]="ticket.description"
            placeholder="Describe the problem in detail..."
            rows="5"
            required>
          </textarea>

        </div>


        <!-- Building -->

        <div class="form-group">

          <label for="building">
            Building
          </label>

          <select
            id="building"
            name="building"
            [(ngModel)]="ticket.building">

            <option [ngValue]="0">
              Main Library
            </option>

            <option [ngValue]="1">
              Engineering Building
            </option>

            <option [ngValue]="2">
              Science Building
            </option>

            <option [ngValue]="3">
              Computer Science Building
            </option>

            <option [ngValue]="4">
              Administration Building
            </option>

            <option [ngValue]="5">
              Student Center
            </option>

          </select>

        </div>


        <!-- Room -->

        <div class="form-group">

          <label for="room">
            Room Number
          </label>

          <input
            id="room"
            type="text"
            name="room"
            [(ngModel)]="ticket.room"
            placeholder="Example: Room 204"
            required
          />

        </div>


        <!-- Category -->

        <div class="form-group">

          <label for="category">
            Category
          </label>

          <select
            id="category"
            name="category"
            [(ngModel)]="ticket.category">

            <option [ngValue]="0">
              Computer / IT
            </option>

            <option [ngValue]="1">
              Network / Wi-Fi
            </option>

            <option [ngValue]="2">
              Projector
            </option>

            <option [ngValue]="3">
              Electrical
            </option>

            <option [ngValue]="4">
              Plumbing / Water
            </option>

            <option [ngValue]="5">
              Other
            </option>

          </select>

        </div>


        <!-- Priority -->

        <div class="form-group">

          <label for="priority">
            Priority
          </label>

          <select
            id="priority"
            name="priority"
            [(ngModel)]="ticket.priority">

            <option [ngValue]="0">
              Low
            </option>

            <option [ngValue]="1">
              Medium
            </option>

            <option [ngValue]="2">
              High
            </option>

          </select>

        </div>


        <!-- Messages -->

        @if (successMessage) {

          <div class="success-message">
            {{ successMessage }}
          </div>

        }


        @if (errorMessage) {

          <div class="error-message">
            {{ errorMessage }}
          </div>

        }


        <!-- Buttons -->

        <div class="form-actions">

          <button
            type="button"
            class="cancel-button"
            (click)="goBack()">

            Cancel

          </button>


          <button
            type="submit"
            class="submit-button"
            [disabled]="isLoading">

            @if (isLoading) {
              Submitting...
            } @else {
              Submit Ticket
            }

          </button>

        </div>


      </form>

    </section>

  </main>

</div>
